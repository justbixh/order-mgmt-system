spring:
  application:
    name: inventory-service
  config:
    import: classpath:messaging-defaults.yml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/inventory
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8082}

inventory:
  reservation-ttl: ${INVENTORY_RESERVATION_TTL:2m}          # unpaid reservations are released after this
  expiry-check-interval-ms: ${INVENTORY_EXPIRY_CHECK_MS:10000}

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http
