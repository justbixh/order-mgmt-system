# Infrastructure + the four services.
#   Infra only (run services from your IDE):  docker compose up -d postgres kafka kafka-ui jaeger
#   Everything:                               docker compose up -d --build
name: order-mgmt

x-service-env: &service-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  DB_HOST: postgres
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
  # Jaeger only ingests traces; without this the OTLP meter registry retries localhost:4318 and spams warnings.
  MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Single-node Kafka in KRaft mode (no ZooKeeper).
  # Two listeners: containers use kafka:29092, your host machine uses localhost:9092.
  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Web UI to browse topics, messages, consumer groups and dead-letter topics: http://localhost:8090
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # Distributed tracing UI: http://localhost:16686 (receives OTLP over HTTP on 4318)
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "16686:16686"
      - "4318:4318"

  order-service:
    build: { context: ., args: { SERVICE: order-service } }
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }
    ports: ["8081:8081"]
    environment: *service-env

  inventory-service:
    build: { context: ., args: { SERVICE: inventory-service } }
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }
    ports: ["8082:8082"]
    environment: *service-env

  payment-service:
    build: { context: ., args: { SERVICE: payment-service } }
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }
    ports: ["8083:8083"]
    environment: *service-env

  notification-service:
    build: { context: ., args: { SERVICE: notification-service } }
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }
    ports: ["8084:8084"]
    environment: *service-env

volumes:
  pgdata:
