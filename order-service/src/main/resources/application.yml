spring:
  application:
    name: order-service
  config:
    import: classpath:messaging-defaults.yml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/orders
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8081}

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http

springdoc:
  swagger-ui:
    path: /swagger-ui.html
