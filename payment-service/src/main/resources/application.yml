spring:
  application:
    name: payment-service
  config:
    import: classpath:messaging-defaults.yml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/payments
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8083}

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http
